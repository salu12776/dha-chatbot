<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHA Phase 8 Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1d2a24; --muted: #6b7a72;
    --brand: #1f5c45; --brand-ink: #ffffff; --line: #e3ddd0; --bot: #f7f5f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111714; --panel: #18201c; --ink: #e8eee9; --muted: #95a59c;
            --brand: #3f9c76; --brand-ink: #0d1411; --line: #2a3530; --bot: #1f2924; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 Inter, system-ui, sans-serif; height: 100dvh; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 760px; display: flex; flex-direction: column; height: 100dvh; padding: 0 16px; }
  header { padding: 20px 0 14px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 18px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin: 0; }
  .bot table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0; display: block; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
  .bot th { background: var(--panel); }
  .typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
          padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--brand); }
  form { display: flex; gap: 8px; padding: 12px 0 18px; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink); font: inherit; }
  input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  button.send { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px;
                padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>DHA Phase 8 Assistant</h1>
    <p>Live listings · English ya Roman Urdu mein poochein</p>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips">
    <button class="chip">Sab se sasta commercial plot konsa hai?</button>
    <button class="chip">5 crore se kam 1 kanal plots</button>
    <button class="chip">Block T mein kya available hai?</button>
  </div>
  <form id="form">
    <input id="q" placeholder="Apna sawal likhein..." autocomplete="off" required>
    <button class="send" type="submit">Send</button>
  </form>
</div>
<script>
  // Same server se serve ho to "" kaafi hai. Kisi aur website par lagayein to poora URL likhein:
  // const API = "https://dha-chatbot.onrender.com";
  const API = "";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const sendBtn = form.querySelector("button");

  function add(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    if (who === "bot") div.innerHTML = DOMPurify.sanitize(marked.parse(text));
    else div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function send(question) {
    document.getElementById("chips").style.display = "none";
    add(question, "user");
    const wait = add("Soch raha hoon...", "bot");
    wait.classList.add("typing");
    sendBtn.disabled = true;
    try {
      const res = await fetch(API + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      wait.remove();
      add(res.ok ? data.answer : "Error: " + (data.detail || res.status), "bot");
    } catch (e) {
      wait.remove();
      add("Server se rabta nahi ho saka. Thori der baad dobara try karein.", "bot");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    send(q);
  });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => send(c.textContent)));
</script>
</body>
</html>
